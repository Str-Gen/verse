<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' ipc: http://ipc.localhost; object-src 'none'; base-uri 'none'; form-action 'none'"><title>Quiet reader</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><span id="title">Quiet reader</span><label class="open">Open book JSON<input id="open" type="file" accept=".json,application/json"></label><button id="settings-button">Reading settings</button></header>
<aside id="settings" hidden><label>Chapter <select id="chapters"></select></label><label>Text size <input id="font-size" type="range" min="16" max="32" value="22"></label><label>Words per minute <input id="speed" type="number" min="75" max="1000" step="25" value="350"></label><label><input id="feedback-enabled" type="checkbox" checked> Ask for chapter feedback</label><label><input id="follow-notes" type="checkbox"> Follow notes during playback</label><button id="history-button">Feedback history</button></aside>
<div id="notice" role="status"></div>
<main id="reading"><div id="viewport"><article id="book"></article></div></main>
<section id="playback" hidden aria-label="Playback"><div id="guide"></div><div id="word"></div><div id="play-status" aria-live="polite"></div><button id="return">Return to text · Esc</button></section>
<footer><button id="previous" aria-label="Previous page">←</button><span id="page-label"></span><button id="next" aria-label="Next page">→</button><button id="play">Read from here · Space</button></footer>
<dialog id="boundary"><form method="dialog"><h2>Chapter complete</h2><div id="questions"><label>How did the pace feel?<select id="pace"><option value="comfortable">Comfortable</option><option value="slow">Too slow</option><option value="fast">Too fast</option></select></label><label>How well could you follow the text?<select id="understanding"><option value="easily">Easily</option><option value="mostly">Mostly</option><option value="struggled">Struggled</option></select></label><label id="suggestion" hidden><input id="accept-speed" type="checkbox"><span id="suggestion-text"></span></label><button id="save-feedback" type="button">Save and continue</button></div><button id="skip-feedback" type="button">Skip and continue</button><button>Return to text</button></form></dialog>
<dialog id="details"><h2 id="details-title"></h2><div id="details-body"></div><button id="clear-history" hidden>Clear this book's history</button><button id="close-details">Close</button></dialog>
<dialog id="recovery"><h2>This edition has changed</h2><p id="recovery-text"></p><button id="accept-recovery">Use offered position</button><button id="cancel-recovery">Keep old saved position</button></dialog>
<script type="module" src="app.js"></script></body></html>
