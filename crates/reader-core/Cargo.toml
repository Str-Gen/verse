[package]
name = "reader-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
base64-simd = { version = "0.8", features = ["detect"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "avif-native", "bmp", "tiff"] }
memchr = { version = "2.7", features = ["std"] }
percent-encoding = "2.3"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[dev-dependencies]
base64 = "0.22"
rbook = { version = "=0.7.12", default-features = false }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
