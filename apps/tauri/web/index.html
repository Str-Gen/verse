<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self' ipc: http://ipc.localhost; object-src 'none'; base-uri 'none'; form-action 'none'"><title>Verse</title><link rel="stylesheet" href="style.css"></head>
<body>
<header id="book-controls" hidden><span id="title">Verse</span><label class="open"><span id="open-label">Open book JSON</span><input id="open" type="file" accept=".json,application/json"></label><button id="font-smaller" aria-label="Decrease reading font">A−</button><button id="font-larger" aria-label="Increase reading font">A+</button><input id="font-size" type="hidden" value="20"></header>
<div id="stage">
<aside id="settings" hidden><h2>Contents</h2><select id="chapters" size="12" aria-label="Contents"></select><label><input id="follow-notes" type="checkbox"> Play footnotes</label><label><input id="feedback-enabled" type="checkbox" checked> Chapter feedback</label><button id="vocabulary-button">Word list · V</button><button id="capture-button">Capture · C</button><label>Capture window <select id="capture-scope"><option value="seconds">Five seconds</option><option value="sentences">Three sentences</option></select></label><button id="history-button">Feedback history</button></aside>
<div id="reading-stage">
<div id="notice" role="status"></div>
<main id="reading"><div id="viewport"><article id="book"></article></div></main>
<section id="playback" hidden aria-label="Playback"><div id="word"></div><div id="guide"></div><div id="play-status" aria-live="polite"></div></section></div></div>
<footer><button id="settings-button" aria-label="Reader controls" aria-expanded="false" aria-controls="book-controls settings">⋯</button><button id="previous" aria-label="Previous page">Previous</button><span id="page-label"></span><button id="next" aria-label="Next page">Next</button><button id="return" hidden>Return to text</button><label id="speed-control" hidden>WPM <input id="speed" type="number" min="60" max="1200" step="25" value="350"></label><button id="play">Play selection</button></footer><div id="book-progress" aria-label="Book progress">0.0%</div>
<dialog id="boundary"><form method="dialog"><h2>Chapter complete</h2><div id="questions"><label>How did the pace feel?<select id="pace"><option value="comfortable">Comfortable</option><option value="slow">Too slow</option><option value="fast">Too fast</option></select></label><label>How well could you follow the text?<select id="understanding"><option value="easily">Easily</option><option value="mostly">Mostly</option><option value="struggled">Struggled</option></select></label><label id="suggestion" hidden><input id="accept-speed" type="checkbox"><span id="suggestion-text"></span></label><button id="save-feedback" type="button">Save and continue</button></div><button id="skip-feedback" type="button">Skip and continue</button><button>Return to text</button></form></dialog>
<dialog id="details"><h2 id="details-title"></h2><div id="details-body"></div><button id="clear-history" hidden>Clear this book's history</button><button id="close-details">Close</button></dialog>
<dialog id="recovery"><h2>This edition has changed</h2><p id="recovery-text"></p><button id="accept-recovery">Use offered position</button><button id="cancel-recovery">Keep old saved position</button></dialog>
<dialog id="vocabulary"><h2>Word list</h2><p id="vocabulary-status" role="status"></p><div id="vocabulary-rows"></div><button id="practice-start">Practice saved words</button><button id="vocabulary-close">Close</button></dialog>
<dialog id="practice"><h2>Recognition practice</h2><div id="practice-word"></div><div id="practice-context"></div><div id="practice-definition"></div><button id="practice-reveal">Reveal context and definitions</button><button id="practice-comfortable">Comfortable</button><button id="practice-difficult">Difficult</button><button id="practice-skip">Skip</button><button id="practice-close">Finish</button><p id="practice-counts"></p></dialog>
<script type="module" src="app.js"></script></body></html>
